name: CI

on:
  push:
    branches: ['**']
    paths:
      - 'src/go/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/go/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: Lint / Format (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum
      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Install dev dependencies
        run: make install-dev
      - name: Cache golangci-lint analysis cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('src/go/go.sum') }}
          restore-keys: golangci-lint-
      - name: Generate code
        run: make generate
      - name: Lint
        run: make check

  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum
      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Generate code
        working-directory: src/go
        run: make generate
      - name: Run tests with coverage
        working-directory: src/go
        run: make test
